name: Go CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod tidy

      - name: Verify go.mod/go.sum unchanged
        run: |
          if [ -f go.sum ]; then
            git diff --exit-code -- go.mod go.sum
          else
            git diff --exit-code -- go.mod
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Setup Python (for prek)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install prek
        run: |
          python -m pip install --upgrade pip
          python -m pip install prek
          prek --version

      - name: Pre-commit checks (prek)
        run: |
          prek validate-config
          prek run --all-files

      - name: Unit tests
        run: go test ./... -count=1

      - name: BDD tests
        if: ${{ hashFiles('tests/bdd/**/*.go') != '' }}
        run: go test -tags=bdd ./tests/bdd/... -count=1

      - name: Build
        run: go build -v ./cmd/aria2-cli
